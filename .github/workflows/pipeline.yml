name: DevOps CI Pipeline

on:
  push:
    branches:
      - main

jobs:

  build:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Show files
      run: |
        ls -la

    - name: Run deployment script
      run: |
        chmod +x scripts/deploy.sh
        ./scripts/deploy.sh
